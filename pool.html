<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chelsea Paisley</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#086b8e; }
canvas { display:block; width:100%; height:100%; }

</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function rand(a,b){ return a + secureRandom()*(b-a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function secureRandom() {
  if (window.crypto && crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] / 4294967296;
  }
  return Math.random();
}

function drawValve(ctx, cx, cy, r, va) {
  const vl = r*0.14;
  const vdx = Math.cos(va), vdy = Math.sin(va);
  const vx = cx + r*vdx, vy = cy + r*vdy;
  const vpx = -vdy, vpy = vdx, hw = r*0.036;
  const corners = [
    [vx+vpx*hw, vy+vpy*hw],
    [vx+vdx*vl+vpx*hw, vy+vdy*vl+vpy*hw],
    [vx+vdx*vl-vpx*hw, vy+vdy*vl-vpy*hw],
    [vx-vpx*hw, vy-vpy*hw],
  ];
  ctx.save();
  ctx.beginPath(); ctx.moveTo(corners[0][0],corners[0][1]);
  corners.forEach(c=>ctx.lineTo(c[0],c[1])); ctx.closePath();
  ctx.fillStyle='rgba(225,228,232,0.84)'; ctx.fill();
  ctx.fillStyle='rgba(185,188,196,0.90)';
  ctx.beginPath(); ctx.arc(vx+vdx*(vl-r*0.022), vy+vdy*(vl-r*0.022), r*0.026, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawValveShadow(ctx, cx, cy, r, va) {
  const vl = r*0.14;
  const vdx = Math.cos(va), vdy = Math.sin(va);
  const svx = cx + r*vdx, svy = cy + r*vdy;
  const vpx = -vdy, vpy = vdx, hw = r*0.036;
  ctx.beginPath();
  ctx.moveTo(svx+vpx*hw, svy+vpy*hw);
  ctx.lineTo(svx+vdx*vl+vpx*hw, svy+vdy*vl+vpy*hw);
  ctx.lineTo(svx+vdx*vl-vpx*hw, svy+vdy*vl-vpy*hw);
  ctx.lineTo(svx-vpx*hw, svy-vpy*hw);
  ctx.closePath(); ctx.fillStyle='rgba(0,20,45,1)'; ctx.fill();
}
const rngSeeded = s => { let x = Math.sin(s)*10000; return x - Math.floor(x); };

function innerRimShadow(ctx, cx, cy, inner, outerFillR, darkness) {
  const g = ctx.createRadialGradient(cx, cy, inner*1.18, cx, cy, inner);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${darkness})`);
  ctx.beginPath();
  ctx.arc(cx, cy, outerFillR, 0, Math.PI*2, false);
  ctx.arc(cx, cy, inner, 0, Math.PI*2, true);
  ctx.fillStyle = g;
  ctx.fill('evenodd');
}

function buildDonutShadow(r) {
  const inner=r*0.40, biteAngle=Math.PI*1.20, biteR=r*0.40, biteCentreR=r*1.02;
  const nJ=8, jS=nJ*12, jA=r*0.020, eW=r*0.055;
  const d2=biteCentreR;
  const cosA=(d2*d2+biteR*biteR-r*r)/(2*d2*biteR);
  const hs=Math.acos(Math.max(-1,Math.min(1,cosA)));
  const obdx=biteCentreR*Math.cos(biteAngle), obdy=biteCentreR*Math.sin(biteAngle);
  const bArcMid=Math.atan2(-obdy,-obdx);
  const bA1=bArcMid-hs, bA2=bArcMid+hs;
  const pad=20, sz=Math.ceil(r*2+pad*2);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const sc=cv.getContext('2d'); const so=r+pad;
  const sbx=so+obdx, sby=so+obdy;
  sc.beginPath(); sc.arc(so,so,r,0,Math.PI*2,false); sc.arc(so,so,inner,0,Math.PI*2,true);
  sc.fillStyle='rgba(0,20,45,1)'; sc.fill('evenodd');
  drawValveShadow(sc, so, so, r, Math.PI*0.08);
  sc.globalCompositeOperation='destination-out';
  sc.beginPath();
  sc.arc(sbx,sby,biteR,0,Math.PI*2,false);
  for (let i=0;i<=jS;i++) {
    const f=i/jS, a=bA1+f*(bA2-bA1);
    const wig=Math.sin(f*Math.PI*2*nJ)*jA;
    const rr=biteR-eW-wig;
    i===0?sc.moveTo(sbx+rr*Math.cos(a),sby+rr*Math.sin(a)):sc.lineTo(sbx+rr*Math.cos(a),sby+rr*Math.sin(a));
  }
  sc.arc(sbx,sby,biteR,bA2,bA1,true);
  sc.closePath(); sc.fillStyle='rgba(0,0,0,1)'; sc.fill('evenodd');
  sc.globalCompositeOperation='source-over';
  return {canvas:cv, w:sz, h:sz};
}
function buildDonut(r) {
  const inner=r*0.40, icingOuter=r*0.915, biteAngle=Math.PI*1.20, biteR=r*0.40, biteCentreR=r*1.02;
  const nW=22, stp=nW*8;
  const nJ=8, jS=nJ*12, jA=r*0.020, eW=r*0.055;
  const d2=biteCentreR;
  const cosA=(d2*d2+biteR*biteR-r*r)/(2*d2*biteR);
  const halfSpan=Math.acos(Math.max(-1,Math.min(1,cosA)));
  const pad=20, sz=Math.ceil(r*2+pad*2);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const oc=cv.getContext('2d'); const ox=r+pad, oy=r+pad;
  const obx=ox+biteCentreR*Math.cos(biteAngle), oby=oy+biteCentreR*Math.sin(biteAngle);
  const biteArcMid=Math.atan2(oy-oby, ox-obx);
  const biteA1=biteArcMid-halfSpan, biteA2=biteArcMid+halfSpan;

  oc.beginPath(); oc.arc(ox,oy,r,0,Math.PI*2,false); oc.arc(ox,oy,inner,0,Math.PI*2,true);
  const dg=oc.createRadialGradient(ox,oy,inner,ox,oy,r);
  dg.addColorStop(0,'#d4924a'); dg.addColorStop(0.4,'#df9f55'); dg.addColorStop(0.75,'#cf8840'); dg.addColorStop(1,'#b87030');
  oc.fillStyle=dg; oc.fill('evenodd');

  oc.beginPath();
  for (let i=0;i<=stp;i++) {
    const a=(i/stp)*Math.PI*2;
    const rr=icingOuter+Math.sin((i/stp)*Math.PI*2*nW)*r*0.038;
    i===0?oc.moveTo(ox+rr*Math.cos(a),oy+rr*Math.sin(a)):oc.lineTo(ox+rr*Math.cos(a),oy+rr*Math.sin(a));
  }
  oc.closePath(); oc.arc(ox,oy,inner,0,Math.PI*2,true);
  oc.fillStyle='#f48fb1'; oc.fill('evenodd');

  const iHL=oc.createRadialGradient(ox-r*0.2,oy-r*0.18,0,ox,oy,r*0.85);
  iHL.addColorStop(0,'rgba(255,215,232,0.50)'); iHL.addColorStop(0.5,'rgba(255,195,220,0.10)'); iHL.addColorStop(1,'rgba(0,0,0,0)');
  oc.fillStyle=iHL;
  oc.beginPath(); oc.arc(ox,oy,r,0,Math.PI*2); oc.arc(ox,oy,inner,0,Math.PI*2,true); oc.fill('evenodd');

  innerRimShadow(oc, ox, oy, inner, r, 0.16);

  oc.globalCompositeOperation='destination-out';
  oc.beginPath();
  oc.arc(obx,oby,biteR,0,Math.PI*2,false);
  for (let i=0;i<=jS;i++) {
    const f=i/jS, a=biteA1+f*(biteA2-biteA1);
    const wig=Math.sin(f*Math.PI*2*nJ)*jA;
    const rr=biteR-eW-wig;
    i===0?oc.moveTo(obx+rr*Math.cos(a),oby+rr*Math.sin(a)):oc.lineTo(obx+rr*Math.cos(a),oby+rr*Math.sin(a));
  }
  oc.arc(obx,oby,biteR,biteA2,biteA1,true);
  oc.closePath(); oc.fillStyle='rgba(0,0,0,1)'; oc.fill('evenodd');
  oc.globalCompositeOperation='source-over';

  const sc2=['hsl(345,65%,62%)','hsl(225,60%,62%)','hsl(45,70%,58%)','hsl(140,52%,55%)','hsl(25,65%,60%)','hsl(275,52%,62%)'];
  for (let i=0;i<80;i++) {
    const a=rngSeeded(i*7.1)*Math.PI*2;
    const rad=inner*1.15+rngSeeded(i*3.3)*(icingOuter*0.88-inner*1.15);
    const sx=ox+rad*Math.cos(a), sy=oy+rad*Math.sin(a);
    const dbx=sx-obx, dby=sy-oby;
    if (Math.sqrt(dbx*dbx+dby*dby)<biteR) continue;
    const dc=Math.sqrt((sx-ox)**2+(sy-oy)**2);
    if (dc>icingOuter*0.97||dc<inner*1.08) continue;
    oc.save(); oc.translate(sx,sy); oc.rotate(rngSeeded(i*11.7)*Math.PI);
    oc.fillStyle=sc2[Math.floor(rngSeeded(i*5.3)*sc2.length)];
    oc.beginPath(); oc.ellipse(0,0,r*0.062,r*0.020,0,0,Math.PI*2); oc.fill();
    oc.restore();
  }
  drawValve(oc, ox, oy, r, Math.PI*0.08);
  return {canvas:cv, w:sz, h:sz};
}

function buildWatermelonShadow(r) {
  const inner=r*0.40, pad=20, sz=Math.ceil(r*2+pad*2);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const sc=cv.getContext('2d'); const so=r+pad;
  sc.beginPath(); sc.arc(so,so,r,0,Math.PI*2,false); sc.arc(so,so,inner,0,Math.PI*2,true);
  sc.fillStyle='rgba(0,20,45,1)'; sc.fill('evenodd');
  drawValveShadow(sc, so, so, r, Math.PI*0.08);
  return {canvas:cv, w:sz, h:sz};
}
function buildWatermelon(r) {
  const inner=r*0.40, pad=20, sz=Math.ceil(r*2+pad*2);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const oc=cv.getContext('2d'); const ox=r+pad, oy=r+pad;
  oc.beginPath(); oc.arc(ox,oy,r,0,Math.PI*2,false); oc.arc(ox,oy,inner,0,Math.PI*2,true);
  oc.fillStyle='#2d8a3e'; oc.fill('evenodd');
  oc.beginPath(); oc.arc(ox,oy,r*0.93,0,Math.PI*2,false); oc.arc(ox,oy,r*0.88,0,Math.PI*2,true);
  oc.fillStyle='#7ec850'; oc.fill('evenodd');
  oc.beginPath(); oc.arc(ox,oy,r*0.875,0,Math.PI*2,false); oc.arc(ox,oy,r*0.855,0,Math.PI*2,true);
  oc.fillStyle='rgba(240,245,230,0.90)'; oc.fill('evenodd');
  oc.beginPath(); oc.arc(ox,oy,r*0.852,0,Math.PI*2,false); oc.arc(ox,oy,inner,0,Math.PI*2,true);
  oc.fillStyle='#e8384a'; oc.fill('evenodd');
  const fHL=oc.createRadialGradient(ox-r*0.15,oy-r*0.15,0,ox,oy,r*0.8);
  fHL.addColorStop(0,'rgba(255,180,180,0.35)'); fHL.addColorStop(1,'rgba(0,0,0,0)');
  oc.fillStyle=fHL;
  oc.beginPath(); oc.arc(ox,oy,r*0.852,0,Math.PI*2); oc.arc(ox,oy,inner,0,Math.PI*2,true); oc.fill('evenodd');

  innerRimShadow(oc, ox, oy, inner, r*0.852, 0.18);

  const seedInner=inner*1.22, seedOuter=r*0.800, total=38;
  for (let i=0;i<total;i++) {
    const a=(i/total)*Math.PI*2 + (rngSeeded(i*13.7+1)-0.5)*(Math.PI*2/total)*0.7;
    const rad=seedInner+rngSeeded(i*3.3+2)*(seedOuter-seedInner);
    const tilt=a+Math.PI*0.5+(rngSeeded(i*2.3+3)-0.5)*0.6;
    const sx=ox+rad*Math.cos(a), sy=oy+rad*Math.sin(a);
    oc.save(); oc.translate(sx,sy); oc.rotate(tilt);
    oc.fillStyle='#1a1a1a';
    oc.beginPath(); oc.ellipse(0,0,r*0.016,r*0.028,0,0,Math.PI*2); oc.fill();
    oc.restore();
  }
  drawValve(oc, ox, oy, r, Math.PI*0.08);
  return {canvas:cv, w:sz, h:sz};
}

function buildStripedShadow(r) {
  const inner=r*0.40, pad=20, sz=Math.ceil(r*2+pad*2);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const sc=cv.getContext('2d'); const so=r+pad;
  sc.beginPath(); sc.arc(so,so,r,0,Math.PI*2,false); sc.arc(so,so,inner,0,Math.PI*2,true);
  sc.fillStyle='rgba(0,20,45,1)'; sc.fill('evenodd');
  drawValveShadow(sc, so, so, r, Math.PI*0.08);
  return {canvas:cv, w:sz, h:sz};
}
function buildStriped(r) {
  const inner=r*0.40, pad=20, sz=Math.ceil(r*2+pad*2);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const oc=cv.getContext('2d'); const ox=r+pad, oy=r+pad;
  const colours=['#ffffff','#ffb3c6','#ffffff','#b3d9ff','#ffffff','#b3ffcc','#ffffff','#ffd9b3'];
  const nStripes=colours.length;
  oc.save();
  oc.beginPath(); oc.arc(ox,oy,r,0,Math.PI*2,false); oc.arc(ox,oy,inner,0,Math.PI*2,true); oc.clip('evenodd');
  for (let s=0;s<nStripes;s++) {
    const a0=(s/nStripes)*Math.PI*2, a1=((s+1)/nStripes)*Math.PI*2;
    oc.beginPath(); oc.arc(ox,oy,r,a0,a1,false); oc.arc(ox,oy,inner,a1,a0,true); oc.closePath();
    oc.fillStyle=colours[s]; oc.fill();
    const midA=(a0+a1)/2;
    const sg=oc.createLinearGradient(ox+r*0.82*Math.cos(midA),oy+r*0.82*Math.sin(midA),ox+r*Math.cos(midA),oy+r*Math.sin(midA));
    sg.addColorStop(0,'rgba(0,0,0,0)'); sg.addColorStop(1,'rgba(0,0,0,0.14)');
    oc.beginPath(); oc.arc(ox,oy,r,a0,a1,false); oc.arc(ox,oy,inner,a1,a0,true); oc.closePath();
    oc.fillStyle=sg; oc.fill();
  }
  for (let s=0;s<nStripes;s++) {
    const a=(s/nStripes)*Math.PI*2;
    oc.beginPath(); oc.moveTo(ox+inner*Math.cos(a),oy+inner*Math.sin(a)); oc.lineTo(ox+r*Math.cos(a),oy+r*Math.sin(a));
    oc.strokeStyle='rgba(180,180,180,0.22)'; oc.lineWidth=0.8; oc.stroke();
  }
  innerRimShadow(oc, ox, oy, inner, r, 0.16);
  oc.restore();
  drawValve(oc, ox, oy, r, Math.PI*0.08);
  return {canvas:cv, w:sz, h:sz};
}

function buildSwanShadow(r) {
  const inner=r*0.42, sz=Math.ceil(r*2 + r*2.0);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const sc=cv.getContext('2d'); const so=sz/2;
  function shadowWing(s) {
    const ax=so+s*r*0.88, ay=so-r*0.20;
    sc.save(); sc.translate(ax,ay);
    sc.beginPath();
    sc.moveTo(s*r*0.05, r*0.02);
    sc.bezierCurveTo(s*r*0.55,-r*0.55, s*r*0.85,r*0.15, s*r*0.32,r*0.78);
    sc.bezierCurveTo(s*r*0.08,r*0.56, s*r*0.04,r*0.18, s*r*0.05,r*0.02);
    sc.fillStyle='rgba(0,20,45,1)'; sc.fill();
    sc.restore();
  }
  shadowWing(-1); shadowWing(1);
  sc.beginPath(); sc.ellipse(so, so+r*0.88, r*0.22, r*0.16, 0, 0, Math.PI*2);
  sc.fillStyle='rgba(0,20,45,1)'; sc.fill();
  sc.beginPath(); sc.arc(so,so,r,0,Math.PI*2,false); sc.arc(so,so,inner,0,Math.PI*2,true);
  sc.fillStyle='rgba(0,20,45,1)'; sc.fill('evenodd');

  const shcx=so, shcr=r*0.52, shcy=so-r-shcr*0.10;
  const shTipY=shcy-shcr*1.917, shBaseY=shcy-shcr*0.375, shBaseHW=shcr*1.00;
  sc.beginPath(); sc.arc(shcx, shcy, shcr, 0, Math.PI*2);
  sc.fillStyle='rgba(0,20,45,1)'; sc.fill();
  const shTipArcR=shcr*0.30, shTipHW=shcr*0.28, shTipArcCY=shTipY+shTipArcR*2.2;
  const shTipLRY=shTipArcCY-Math.sqrt(Math.max(0, shTipArcR*shTipArcR-shTipHW*shTipHW));
  const shTipLX=shcx-shTipHW, shTipRX=shcx+shTipHW;
  const shTipAngL=Math.atan2(shTipLRY-shTipArcCY, shTipLX-shcx);
  const shTipAngR=Math.atan2(shTipLRY-shTipArcCY, shTipRX-shcx);
  sc.beginPath();
  sc.moveTo(shTipLX, shTipLRY);
  sc.bezierCurveTo(shcx-shcr*0.183, shcy-shcr*1.600, shcx-shcr*0.483, shcy-shcr*0.875, shcx-shBaseHW, shBaseY);
  sc.quadraticCurveTo(shcx, shcy-shcr*1.417, shcx+shBaseHW, shBaseY);
  sc.bezierCurveTo(shcx+shcr*0.483, shcy-shcr*0.875, shcx+shcr*0.183, shcy-shcr*1.600, shTipRX, shTipLRY);
  sc.arc(shcx, shTipArcCY, shTipArcR, shTipAngR, shTipAngL, true);
  sc.closePath(); sc.fillStyle='rgba(0,20,45,1)'; sc.fill();
  drawValveShadow(sc, so, so, r, Math.PI*0.55);
  return {canvas:cv, w:sz, h:sz};
}
function buildSwan(r) {
  const inner=r*0.42, white='#f0eeea', sz=Math.ceil(r*2 + r*2.0);
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const oc=cv.getContext('2d'); const ox=sz/2, oy=sz/2;

  function wingPath(oc, s) {
    oc.beginPath();
    oc.moveTo(s*r*0.05, r*0.02);
    oc.bezierCurveTo(s*r*0.55,-r*0.55, s*r*0.85,r*0.15, s*r*0.32,r*0.78);
    oc.bezierCurveTo(s*r*0.08,r*0.56, s*r*0.04,r*0.18, s*r*0.05,r*0.02);
  }
  function drawWing(flipX) {
    const s = flipX ? -1 : 1;
    oc.save(); oc.translate(ox+s*r*0.88, oy-r*0.20);
    wingPath(oc, s); oc.fillStyle=white; oc.fill();
    const wcx=s*r*0.35, wcy=r*0.22;
    const wg=oc.createRadialGradient(wcx,wcy,0,wcx,wcy,r*0.88);
    wg.addColorStop(0,'rgba(255,255,255,0.20)'); wg.addColorStop(0.65,'rgba(0,0,0,0)'); wg.addColorStop(1,'rgba(0,0,0,0.18)');
    wingPath(oc, s); oc.fillStyle=wg; oc.fill();
    oc.save(); wingPath(oc, s); oc.clip();
    oc.strokeStyle='#e2e0db'; oc.lineWidth=1.2; oc.lineCap='round';
    const wSeamX=s*r*0.35, wSeamT=r*0.12, wSeamB=r*0.55;
    oc.beginPath(); oc.moveTo(wSeamX,wSeamT); oc.lineTo(wSeamX,wSeamB); oc.stroke();
    for (const t of [0.20,0.40,0.60,0.80]) {
      const ty=wSeamT+(wSeamB-wSeamT)*t, hw=r*0.07;
      oc.beginPath(); oc.moveTo(wSeamX-hw,ty); oc.lineTo(wSeamX+hw,ty); oc.stroke();
    }
    oc.restore(); oc.restore();
  }
  drawWing(true); drawWing(false);

  oc.beginPath(); oc.arc(ox,oy,r,0,Math.PI*2,false); oc.arc(ox,oy,inner,0,Math.PI*2,true);
  oc.fillStyle=white; oc.fill('evenodd');
  const outerSh=oc.createRadialGradient(ox,oy,r*0.84,ox,oy,r);
  outerSh.addColorStop(0,'rgba(0,0,0,0)'); outerSh.addColorStop(1,'rgba(0,0,0,0.09)');
  oc.beginPath(); oc.arc(ox,oy,r,0,Math.PI*2,false); oc.arc(ox,oy,inner,0,Math.PI*2,true);
  oc.fillStyle=outerSh; oc.fill('evenodd');
  innerRimShadow(oc, ox, oy, inner, r, 0.16);

  oc.beginPath(); oc.ellipse(ox,oy+r*0.88,r*0.22,r*0.16,0,0,Math.PI*2);
  oc.fillStyle=white; oc.fill();
  const tg=oc.createRadialGradient(ox,oy+r*0.80,0,ox,oy+r*0.88,r*0.28);
  tg.addColorStop(0,'rgba(255,255,255,0.22)'); tg.addColorStop(0.72,'rgba(255,255,255,0.08)'); tg.addColorStop(1,'rgba(0,0,0,0.14)');
  oc.beginPath(); oc.ellipse(ox,oy+r*0.88,r*0.22,r*0.16,0,0,Math.PI*2);
  oc.fillStyle=tg; oc.fill();

  const hcx=ox, hcr=r*0.52, hcy=oy-r-hcr*0.10;
  const tipY=hcy-hcr*1.917, baseY=hcy-hcr*0.375, baseHW=hcr*1.00;
  const arcLCP=hcy-hcr*1.417, arcUCP=hcy-hcr*1.708, eyeHW=hcr*0.733;

  oc.beginPath(); oc.arc(hcx,hcy,hcr,0,Math.PI*2); oc.fillStyle=white; oc.fill();
  const hSh=oc.createRadialGradient(hcx,hcy,hcr*0.78,hcx,hcy,hcr);
  hSh.addColorStop(0,'rgba(0,0,0,0)'); hSh.addColorStop(1,'rgba(0,0,0,0.07)');
  oc.beginPath(); oc.arc(hcx,hcy,hcr,0,Math.PI*2); oc.fillStyle=hSh; oc.fill();

  const tipArcR=hcr*0.30, tipHW=hcr*0.28, tipArcCY=tipY+tipArcR*2.2;
  const tipLRY=tipArcCY-Math.sqrt(Math.max(0, tipArcR*tipArcR-tipHW*tipHW));

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(secureRandom() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickToyKeys(n) {
  
  
  
  
  const slotOrder = shuffled(['floatie', 'bird', 'chair'])
    .concat(shuffled(['floatie', 'floatie', 'bird']));

  const pools = {};
  for (const g in GROUP_MEMBERS) pools[g] = shuffled(GROUP_MEMBERS[g]);
  const picked = [];
  for (let i = 0; i < n; i++) {
    const pool = pools[slotOrder[i]];
    if (pool && pool.length) picked.push(pool.shift());
  }
  return picked;
}

let flowMaxSpeed = 0;

const TAPER_MAX_TIME = 0.35;

function taperDecelZone(speed = flowMaxSpeed) { return Math.max(4, Math.min(30, speed * TAPER_MAX_TIME)); }
function buildFlowField() {
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  const REFERENCE = 400, EXPONENT = 0.4;
  
  
  
  
  
  
  const referenceTargetSpeed = REFERENCE * 0.032 * 0.85;
  const targetSpeed = referenceTargetSpeed * Math.pow(Math.min(W, H) / REFERENCE, EXPONENT); 
  flowMaxSpeed = targetSpeed * 1.1; 
}

function toyDriftVelocity(toy, tMs) {
  const angle = toy.driftAngleBase
    + Math.sin(tMs*toy.driftAngleFreq1 + toy.driftAnglePhase1) * toy.driftAngleAmp1
    + Math.sin(tMs*toy.driftAngleFreq2 + toy.driftAnglePhase2) * toy.driftAngleAmp2;
  const targetSpeed = flowMaxSpeed / 1.1;
  const speedFrac = 0.45 + 0.35 * (0.5 + 0.5*Math.sin(tMs*toy.driftSpeedFreq + toy.driftSpeedPhase));
  const speed = targetSpeed * speedFrac;
  return { u: Math.cos(angle)*speed, v: Math.sin(angle)*speed };
}

function offScreenApproachVelocity(toy, targetX, targetY, outsideMargin, ambientU, ambientV, deepSpeed, decelZone, maxSpeed) {
  const tdx = targetX - toy.x, tdy = targetY - toy.y;
  const tdist = Math.hypot(tdx, tdy) || 1;
  const dirX = tdx/tdist, dirY = tdy/tdist;
  if (outsideMargin > decelZone) {
    return { vx: ambientU + dirX*deepSpeed, vy: ambientV + dirY*deepSpeed };
  }
  
  
  
  
  const MIN_WEIGHT = 0.6;
  const weight = MIN_WEIGHT + (1-MIN_WEIGHT) * (1 - outsideMargin/decelZone);
  const ambientSpeed = Math.hypot(ambientU, ambientV) || 1;
  const blendX = (ambientU/ambientSpeed)*(1-weight) + dirX*weight;
  const blendY = (ambientV/ambientSpeed)*(1-weight) + dirY*weight;
  const blendLen = Math.hypot(blendX, blendY) || 1;
  return { vx: (blendX/blendLen)*maxSpeed, vy: (blendY/blendLen)*maxSpeed };
}

function advanceOffScreenApproach(toy, getTarget, marginX, marginY, ambientU, ambientV, speed, decelZone, maxSpeed, totalDt, screenW, screenH) {
  const FLAT_MAX_SUBSTEP = 0.05; 
  
  
  
  
  
  
  
  
  
  
  
  const MAX_SUBSTEP = Math.min(FLAT_MAX_SUBSTEP, (decelZone * 0.25) / Math.max(speed, 1));
  let remaining = totalDt;
  while (remaining > 1e-6) {
    const outsideMargin = Math.max(
      (-marginX) - toy.x, toy.x - (screenW + marginX),
      (-marginY) - toy.y, toy.y - (screenH + marginY),
      0,
    );
    if (outsideMargin <= 0) return true;
    const step = Math.min(MAX_SUBSTEP, remaining);
    remaining -= step;
    const tgt = getTarget(toy);
    const r = offScreenApproachVelocity(toy, tgt.x, tgt.y, outsideMargin, ambientU, ambientV, speed, decelZone, maxSpeed);
    toy.x += r.vx * step;
    toy.y += r.vy * step;
  }
  const finalOutside = Math.max(
    (-marginX) - toy.x, toy.x - (screenW + marginX),
    (-marginY) - toy.y, toy.y - (screenH + marginY),
    0,
  );
  return finalOutside <= 0;
}

  reset() {
    
    
    
    
    const edge = Math.floor(secureRandom()*4);

const CAUSTIC_WORKER_SRC = `
${envBrightness.toString()}

self.onmessage = function(e) {

};
`;

let causticWorker = null;
let causticWorkerBusy = false;

function initCausticWorker() {
  
  
  
  
  
  if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) return;
  try {
    const blob = new Blob([CAUSTIC_WORKER_SRC], { type: 'application/javascript' });

    causticWorker.onmessage = function(e) {
      if (e.data.type === 'frame') {
        latestCausticRaster = e.data.img;
        causticWorkerBusy = false;
      }

}

function drawRipples(ctx, t) {
  ctx.save();

  ctx.strokeStyle = '#eafcff';
  for (const r of ripples) {
    const age = Math.max(0, t - r.startT);
    const lifeFrac = age / RIPPLE_LIFE_MS;
    if (lifeFrac >= 1) continue;
    const waveR = RIPPLE_SPEED * (age/1000);
    const fadeOut = 1 - lifeFrac;
    for (let i = 0; i < RIPPLE_RING_COUNT; i++) {
      const radius = waveR - i * RIPPLE_RING_SPACING;
      if (radius <= 0) continue;
      ctx.globalAlpha = fadeOut * 0.30 * (1 - i*0.3);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI*2);

function closestSepFromBox(boxCenter, boxAngle, hx, hy, point) {
  const dx0 = point.x - boxCenter.x, dy0 = point.y - boxCenter.y;
  const ca = Math.cos(-boxAngle), sa = Math.sin(-boxAngle);
  const lx = dx0*ca - dy0*sa, ly = dx0*sa + dy0*ca;
  const cx = Math.max(-hx, Math.min(hx, lx)), cy = Math.max(-hy, Math.min(hy, ly));
  const ca2 = Math.cos(boxAngle), sa2 = Math.sin(boxAngle);
  const wx = boxCenter.x + (cx*ca2 - cy*sa2), wy = boxCenter.y + (cx*sa2 + cy*ca2);
  const ddx = point.x - wx, ddy = point.y - wy;
  const dist = Math.hypot(ddx, ddy);
  if (dist < 1e-4) {
    
    
    
    
    
    
    
    
    
    
    
    
    let fdx = dx0, fdy = dy0;
    if (Math.hypot(fdx, fdy) < 1e-4) { fdx = 1; fdy = 0; } 
    const fdist = Math.hypot(fdx, fdy);
    return { dist, nx: fdx/fdist, ny: fdy/fdist };
  }
  return { dist, nx: ddx/dist, ny: ddy/dist };
}

function closestSepFromCapsule(p1, p2, radius, point) {
  const abx = p2.x - p1.x, aby = p2.y - p1.y;
  const abLenSq = abx*abx + aby*aby;
  let t = 0;
  if (abLenSq > 1e-9) {
    t = ((point.x-p1.x)*abx + (point.y-p1.y)*aby) / abLenSq;
    t = Math.max(0, Math.min(1, t));
  }
  const cx = p1.x + abx*t, cy = p1.y + aby*t; 
  const ddx = point.x - cx, ddy = point.y - cy;
  const segDist = Math.hypot(ddx, ddy);
  const dist = Math.max(0, segDist - radius); 
  if (segDist < 1e-4) {
    
    
    
    
    
    
    let fdx = -aby, fdy = abx; 
    if (Math.hypot(fdx, fdy) < 1e-4) { fdx = 1; fdy = 0; }
    const flen = Math.hypot(fdx, fdy);
    return { dist, nx: fdx/flen, ny: fdy/flen };
  }
  return { dist, nx: ddx/segDist, ny: ddy/segDist };
}

function closestSepFromTriangle(p1, p2, p3, point) {
  function closestOnSeg(a, b, p) {
    const abx = b.x-a.x, aby = b.y-a.y;
    const ab2 = abx*abx + aby*aby;
    let t = 0;
    if (ab2 > 1e-9) { t = ((p.x-a.x)*abx + (p.y-a.y)*aby) / ab2; t = Math.max(0, Math.min(1, t)); }
    return { x: a.x+abx*t, y: a.y+aby*t };
  }
  
  
  
  
  function sign(a, b, p) { return (b.x-a.x)*(p.y-a.y) - (b.y-a.y)*(p.x-a.x); }
  const s1 = sign(p1,p2,point), s2 = sign(p2,p3,point), s3 = sign(p3,p1,point);
  const inside = !((s1<0||s2<0||s3<0) && (s1>0||s2>0||s3>0));

  
  
  
  
  const ccx = (p1.x+p2.x+p3.x)/3, ccy = (p1.y+p2.y+p3.y)/3;
  function centroidFallback(dist) {
    let fdx = point.x-ccx, fdy = point.y-ccy;
    if (Math.hypot(fdx, fdy) < 1e-4) { fdx = 1; fdy = 0; }
    const flen = Math.hypot(fdx, fdy);
    return { dist, nx: fdx/flen, ny: fdy/flen };
  }

  if (inside) return centroidFallback(0); 

  const candidates = [closestOnSeg(p1,p2,point), closestOnSeg(p2,p3,point), closestOnSeg(p3,p1,point)];
  let best = candidates[0], dist = Math.hypot(point.x-best.x, point.y-best.y);
  for (let i = 1; i < 3; i++) {
    const d = Math.hypot(point.x-candidates[i].x, point.y-candidates[i].y);
    if (d < dist) { dist = d; best = candidates[i]; }
  }
  if (dist < 1e-4) return centroidFallback(dist); 
  const ddx = point.x-best.x, ddy = point.y-best.y;
  return { dist, nx: ddx/dist, ny: ddy/dist };
}

function distFromPointToPart(point, part) {
  if (part.type === 'circle') {
    const dx = point.x-part.x, dy = point.y-part.y;
    const d = Math.hypot(dx, dy);
    const dist = Math.max(0, d - part.radius);
    if (d < 1e-4) return { dist, nx: 1, ny: 0 };
    return { dist, nx: dx/d, ny: dy/d };
  }
  if (part.type === 'capsule') {
    return closestSepFromCapsule({x:part.x1,y:part.y1}, {x:part.x2,y:part.y2}, part.radius, point);
  }
  if (part.type === 'triangle') {
    return closestSepFromTriangle(part.p1, part.p2, part.p3, point);
  }
  return closestSepFromBox({x:part.cx,y:part.cy}, part.angle, part.hx, part.hy, point); 
}

function partSamplePoints(part) {
  if (part.type === 'circle') return [{x:part.x, y:part.y, radius:part.radius}];
  if (part.type === 'capsule') {
    const mx=(part.x1+part.x2)/2, my=(part.y1+part.y2)/2;
    return [{x:part.x1,y:part.y1,radius:part.radius},{x:part.x2,y:part.y2,radius:part.radius},{x:mx,y:my,radius:part.radius}];
  }
  if (part.type === 'triangle') {
    const {p1,p2,p3} = part;
    const cx=(p1.x+p2.x+p3.x)/3, cy=(p1.y+p2.y+p3.y)/3;
    return [{x:p1.x,y:p1.y,radius:0},{x:p2.x,y:p2.y,radius:0},{x:p3.x,y:p3.y,radius:0},{x:cx,y:cy,radius:0}];
  }
  const ca=Math.cos(part.angle), sa=Math.sin(part.angle); 
  const corners = [[-part.hx,-part.hy],[part.hx,-part.hy],[part.hx,part.hy],[-part.hx,part.hy]]
    .map(([lx,ly]) => ({x: part.cx+lx*ca-ly*sa, y: part.cy+lx*sa+ly*ca, radius:0}));
  return [...corners, {x:part.cx, y:part.cy, radius:0}];
}

function signedDistFromPointToPart(point, part) {
  if (part.type === 'circle') {
    return Math.hypot(point.x-part.x, point.y-part.y) - part.radius;
  }
  if (part.type === 'capsule') {
    const abx=part.x2-part.x1, aby=part.y2-part.y1, ab2=abx*abx+aby*aby;
    let t = 0;
    if (ab2 > 1e-9) { t = ((point.x-part.x1)*abx+(point.y-part.y1)*aby)/ab2; t = Math.max(0, Math.min(1, t)); }
    const cx=part.x1+abx*t, cy=part.y1+aby*t;
    return Math.hypot(point.x-cx, point.y-cy) - part.radius;
  }
  if (part.type === 'triangle') {
    const {p1,p2,p3} = part;
    function sign(a,b,p){ return (b.x-a.x)*(p.y-a.y) - (b.y-a.y)*(p.x-a.x); }
    const s1=sign(p1,p2,point), s2=sign(p2,p3,point), s3=sign(p3,p1,point);
    const inside = !((s1<0||s2<0||s3<0) && (s1>0||s2>0||s3>0));
    if (!inside) return closestSepFromTriangle(p1,p2,p3,point).dist;
    function closestOnSeg(a,b,p){const abx=b.x-a.x,aby=b.y-a.y,ab2=abx*abx+aby*aby;let t=ab2>1e-9?((p.x-a.x)*abx+(p.y-a.y)*aby)/ab2:0;t=Math.max(0,Math.min(1,t));return{x:a.x+abx*t,y:a.y+aby*t};}
    const edges = [closestOnSeg(p1,p2,point), closestOnSeg(p2,p3,point), closestOnSeg(p3,p1,point)];
    return -Math.min(...edges.map(e => Math.hypot(point.x-e.x, point.y-e.y)));
  }
  
  const dx0=point.x-part.cx, dy0=point.y-part.cy;
  const ca=Math.cos(-part.angle), sa=Math.sin(-part.angle);
  const lx=dx0*ca-dy0*sa, ly=dx0*sa+dy0*ca;
  if (Math.abs(lx) <= part.hx && Math.abs(ly) <= part.hy) {
    return -Math.min(part.hx-Math.abs(lx), part.hy-Math.abs(ly));
  }
  return closestSepFromBox({x:part.cx,y:part.cy}, part.angle, part.hx, part.hy, point).dist;
}

function pointInPolygon(point, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].x, yi = points[i].y, xj = points[j].x, yj = points[j].y;
    if (((yi > point.y) !== (yj > point.y)) &&
        (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function partsOverlap(partA, partB) {
  if (partA.type === 'circle') {
    
    
    
    const r = distFromPointToPart({x:partA.x,y:partA.y}, partB);
    return { overlap: partA.radius - r.dist, nx: -r.nx, ny: -r.ny };
  }
  if (partB.type === 'circle') {
    
    
    
    const r = distFromPointToPart({x:partB.x,y:partB.y}, partA);
    return { overlap: partB.radius - r.dist, nx: r.nx, ny: r.ny };
  }
  let best = null;
  for (const s of partSamplePoints(partA)) {
    
    
    const r = distFromPointToPart(s, partB);
    const overlap = s.radius - signedDistFromPointToPart(s, partB);
    if (!best || overlap > best.overlap) best = { overlap, nx: -r.nx, ny: -r.ny };
  }
  for (const s of partSamplePoints(partB)) {
    
    
    const r = distFromPointToPart(s, partA);
    const overlap = s.radius - signedDistFromPointToPart(s, partA);
    if (!best || overlap > best.overlap) best = { overlap, nx: r.nx, ny: r.ny };
  }
  return best;
}

function toyCollPartsWorld(toy) {
  const ca = Math.cos(toy.angle), sa = Math.sin(toy.angle);
  const rot = (x, y) => ({ x: toy.x + x*ca - y*sa, y: toy.y + x*sa + y*ca });
  if (toy.collShape === 'parts') {
    return toy.collParts.map(p => {
      if (p.type === 'circle') { const w = rot(p.x, p.y); return { type:'circle', x:w.x, y:w.y, radius:p.radius }; }
      if (p.type === 'capsule') {
        const w1 = rot(p.x1,p.y1), w2 = rot(p.x2,p.y2);
        return { type:'capsule', x1:w1.x, y1:w1.y, x2:w2.x, y2:w2.y, radius:p.radius };
      }
      const w1=rot(p.p1.x,p.p1.y), w2=rot(p.p2.x,p.p2.y), w3=rot(p.p3.x,p.p3.y); 
      return { type:'triangle', p1:w1, p2:w2, p3:w3 };
    });
  }
  if (toy.collShape === 'circles') {
    return toy.collCircles.map(c => { const w = rot(c.x,c.y); return { type:'circle', x:w.x, y:w.y, radius:c.radius }; });
  }
  if (toy.collShape === 'boxes') {
    return toy.collBoxes.map(b => { const w = rot(b.x,b.y); return { type:'box', cx:w.x, cy:w.y, angle:toy.angle, hx:b.hx, hy:b.hy }; });
  }
  if (toy.collShape === 'box') {
    const c = toy.collCenter();
    return [{ type:'box', cx:c.x, cy:c.y, angle:toy.angle, hx:toy.collHalfExtents.hx, hy:toy.collHalfExtents.hy }];
  }
  const c = toy.collCenter();
  return [{ type:'circle', x:c.x, y:c.y, radius:toy.collR }];
}

function toySurfaceDist(toy, px, py) {
  let best = Infinity;
  for (const part of toyCollPartsWorld(toy)) {
    const d = distFromPointToPart({x:px, y:py}, part).dist;
    if (d < best) best = d;
  }
  return best;
}

let lastT = null;
function tick(t) {

        const rawNx = len > 1e-6 ? sumX/len : best.nx;

        let nx, ny;
        if (prevDir) {
          const retain = Math.pow(REPEL_DIR_RETAIN, dt);
          const bx = prevDir.nx*retain + rawNx*(1-retain);
          const by = prevDir.ny*retain + rawNy*(1-retain);
          const blen = Math.hypot(bx, by) || 1;
          nx = bx/blen; ny = by/blen;
        } else {
          nx = rawNx; ny = rawNy; 
        }
        a.repelDirByPeer.set(b, {nx, ny});

        const push = best.overlap * REPULSION_K;
        a.repelVX -= nx*push; a.repelVY -= ny*push;
        b.repelVX += nx*push; b.repelVY += ny*push;
      } else {
        
        
        
        a.repelDirByPeer.delete(b);
      }
    }
  }

  
  ripples = ripples.filter(r => Math.max(0, t - r.startT) < RIPPLE_LIFE_MS);
  for (const r of ripples) {
    const age = Math.max(0, t - r.startT);
    const waveR = RIPPLE_SPEED * (age/1000);
    const strengthFrac = 1 - age/RIPPLE_LIFE_MS;
    for (const toy of toys) {
      if (r.hitToys.has(toy.id)) continue;
      const tc = toy.collCenter();
      const dx = tc.x - r.x, dy = tc.y - r.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      
      
      
      
      
      const margin = toy.r * 0.4;
      if (waveR + margin >= toySurfaceDist(toy, r.x, r.y)) {
        r.hitToys.add(toy.id);
        
        
        const impulse = flowMaxSpeed * 1.6 * strengthFrac;
        toy.rippleVX += (dx/dist) * impulse;
        toy.rippleVY += (dy/dist) * impulse;
      }
    }
  }

  for (const toy of toys) toy.update(dt, t);

  ctx.drawImage(bgCanvas, 0, 0);

  
  
  
  
  
  
  
  shadowLayerCtx.clearRect(0, 0, W, H);
  for (const toy of toys) toy.drawShadow(shadowLayerCtx);

  requestCausticFrame(t);
  drawRipplesIntoCaustics(t);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.88;
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  ctx.filter = 'blur(1px)';
  ctx.drawImage(causticCanvas, 0, 0, W, H);
  ctx.restore();

  drawRipples(ctx, t);

  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.drawImage(shadowLayer, 0, 0);
  ctx.restore();

  const drawOrder = toys.slice().sort((a, b) => a.y - b.y);
  for (const toy of drawOrder) toy.drawBody(ctx);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
